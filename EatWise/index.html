<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EatWise - Personalized Food Health Advisor</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <nav>
            <h1>EatWise</h1>
            <img src="Vegan.png" alt="Healthy Food 1">
            <p>Your Personalized Food Health Advisor</p>
        </nav>
    </header>

    <section id="home">
        <div class="hero">
            <div class="hero-content">
                <br> <br>
                <br> <br>
               
            </div>
        </div>
    </section>

    <section id="search-section">
        <div class="search-container">
            <input type="text" placeholder="Search for a food product..." class="search-bar">
            <button class="scan-button">Scan Product</button>
        </div>
    </section>

    <section id="suggestions">
        <h2>Healthy Food Suggestions</h2>
        <div class="suggestions-container">
            <div class="suggestion-card">
                <img src="1706626195080.jpg" alt="Healthy Food 1">
                <h3>Healthy Food 1</h3>
                <p>Rich in vitamins and minerals.</p>
            </div>
            <div class="suggestion-card">
                <img src="healthy-food-near-me (1).webp" alt="Healthy Food 2">
                <h3>Healthy Food 2</h3>
                <p>Low in calories, high in fiber.</p>
            </div>
            <div class="suggestion-card">
                <img src="images.jpg" alt="Healthy Food 3">
                <h3>Healthy Food 3</h3>
                <p>Packed with antioxidants.</p>
            </div>
        </div>
    </section>

    <footer>
        <p>&copy; 2025 EatWise. All Rights Reserved.</p>
    </footer>
