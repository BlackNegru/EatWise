<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eat Wise - Search Products</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: #007bff;
        }
        #search-container {
            margin-bottom: 20px;
        }
        input {
            padding: 10px;
            width: 300px;
            margin-right: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            padding: 10px 20px;
            background-color: #28a745;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }
        button:hover {
            background-color: #218838;
        }
        #search-results {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }
        .product-card {
            width: 200px;
            background: white;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            text-align: center;
        }
        .product-card img {
            width: 100%;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <h1>Eat Wise - Food Product Search</h1>
    <div id="search-container">
        <input type="text" id="search-input" placeholder="Enter product name">
        <button onclick="fetchProducts()">Search</button>
    </div>

    <div id="search-results"></div>

    <script>
        async function fetchProducts() {
            const query = document.getElementById("search-input").value.trim();
            if (!query) return alert("Please enter a product name.");

            try {
                const response = await fetch(`http://127.0.0.1:5000/search?query=${query}`);
                const products = await response.json();

                if (products.error) {
                    document.getElementById("search-results").innerHTML = `<p style="color: red;">No products found.</p>`;
                    return;
                }

                localStorage.setItem("searchResults", JSON.stringify(products));
                localStorage.setItem("searchQuery", query);
                displayResults(products);
            } catch (error) {
                console.error("Error fetching products:", error);
                document.getElementById("search-results").innerHTML = `<p style="color: red;">Error fetching products. Try again.</p>`;
            }
        }

        function displayResults(products) {
            document.getElementById("search-results").innerHTML = products.map(product => `
                <div class="product-card" onclick="openProductPage('${product.barcode}')">
                    <img src="${product.image || 'https://via.placeholder.com/150'}" alt="${product.name}">
                    <h3>${product.name}</h3>
                    <p><strong>Quantity:</strong> ${product.quantity || "N/A"}</p>
                </div>
            `).join("");
        }

        function openProductPage(barcode) {
            window.location.href = `product.html?barcode=${barcode}`;
        }

        // Restore previous search results when returning
        window.onload = function () {
            const savedResults = localStorage.getItem("searchResults");
            const savedQuery = localStorage.getItem("searchQuery");
            if (savedResults) {
                document.getElementById("search-input").value = savedQuery;
                displayResults(JSON.parse(savedResults));
            }
        };
    </script>
</body>
</html>
